<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="botGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bot Head -->
  <rect x="16" y="20" width="32" height="28" rx="6" fill="url(#botGradient)" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Bot Eyes -->
  <circle cx="26" cy="32" r="4" fill="#ffffff"/>
  <circle cx="38" cy="32" r="4" fill="#ffffff"/>
  <circle cx="26" cy="32" r="2" fill="#1f2937"/>
  <circle cx="38" cy="32" r="2" fill="#1f2937"/>
  
  <!-- Bot Mouth -->
  <rect x="28" y="40" width="8" height="2" rx="1" fill="#ffffff"/>
  
  <!-- Bot Antennas -->
  <line x1="22" y1="20" x2="20" y2="14" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="20" x2="44" y2="14" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="14" r="2" fill="#f59e0b"/>
  <circle cx="44" cy="14" r="2" fill="#f59e0b"/>
  
  <!-- Bot Body (simplified) -->
  <rect x="24" y="48" width="16" height="8" rx="2" fill="url(#botGradient)" opacity="0.8"/>
  
  <!-- Chat bubble indicator -->
  <circle cx="50" cy="24" r="6" fill="#10b981" opacity="0.9"/>
  <path d="M47 22 h6 v4 h-4 l-2 2 v-2 h-0 z" fill="#ffffff"/>
</svg>