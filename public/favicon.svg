<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  
  <!-- Robot head -->
  <rect x="8" y="10" width="16" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- Eyes -->
  <circle cx="13" cy="16" r="2" fill="#6366f1"/>
  <circle cx="19" cy="16" r="2" fill="#6366f1"/>
  
  <!-- Mouth -->
  <rect x="14" y="20" width="4" height="1" rx="0.5" fill="#6366f1"/>
  
  <!-- Antennas -->
  <circle cx="12" cy="8" r="1" fill="#f59e0b"/>
  <circle cx="20" cy="8" r="1" fill="#f59e0b"/>
  <line x1="13" y1="10" x2="12" y2="9" stroke="#ffffff" stroke-width="1"/>
  <line x1="19" y1="10" x2="20" y2="9" stroke="#ffffff" stroke-width="1"/>
</svg>